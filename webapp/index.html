<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BELUGAS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS home-screen behavior -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BELUGAS">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <meta name="theme-color" content="#66B2B2">
  <meta name="description" content="Report and view beluga whale sightings in Cook Inlet, Alaska.">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
        integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="splash-screen" aria-hidden="true">
    <img class="splash-art" src="img/beluga_background.png" alt="">
    <div class="splash-content">
      <div class="splash-logo">
        <img src="img/beluga_sketch.png" alt="">
      </div>
      <h1 class="splash-title">BELUGAS</h1>
      <p class="splash-tagline">Cook Inlet Beluga Monitoring</p>
    </div>
  </div>

  <header>
    <h1>BELUGAS</h1>
    <button id="menu-open-btn" class="menu-open-btn">≡ MENU</button>
  </header>

  <div id="queue-banner" class="queue-banner" hidden>
    <span>📶 <span id="queue-count">0</span> sighting(s) waiting to upload</span>
    <button id="queue-retry-btn" class="queue-retry-btn">Retry now</button>
  </div>

  <!-- Ports App.kt's MainMenuDrawer -- see main-menu.js's own header comment for the item-set
       reasoning. Right-aligned, vertically centered, bold uppercase white text over the teal
       backdrop, exactly like the native menu column. -->
  <div id="main-menu" class="menu-overlay" hidden>
    <button class="menu-nav-item" data-nav="map">Sightings Map</button>
    <button class="menu-nav-item" data-nav="list">Sightings List</button>
    <button class="menu-nav-item" data-nav="submit">Report Sighting</button>
    <button id="menu-observer-code-item" class="menu-nav-item">Observer Code</button>
    <button id="menu-close-item" class="menu-close-item">← Close</button>
  </div>

  <div id="tier-code-modal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <h2>Enter Observer Code</h2>
      <p class="modal-description">
        Have a one-time observer code from BELUGAS? Enter it here to mark this device as a
        credentialed observer.
      </p>
      <input id="tier-code-input" type="text" inputmode="text" autocapitalize="characters"
             autocomplete="off" placeholder="XXXX-XXXX-XXXX">
      <div class="modal-actions">
        <button id="tier-code-close-btn" class="secondary">Cancel</button>
        <button id="tier-code-submit-btn" class="primary">Submit</button>
      </div>
      <p id="tier-code-status" class="status-info"></p>
    </div>
  </div>

  <main>
    <section id="map-view" class="view">
      <button id="map-verified-toggle-btn" class="verified-toggle-btn map-verified-toggle-btn">VERIFIED ONLY</button>
    </section>

    <section id="list-view" class="view" hidden>
      <div class="list-toolbar">
        <button id="list-verified-toggle-btn" class="verified-toggle-btn">VERIFIED ONLY</button>
      </div>
      <div id="list-items"></div>
    </section>

    <section id="submit-view" class="view" hidden>
      <div id="camera-step">
        <video id="camera-preview" autoplay playsinline muted></video>
        <img id="captured-photo" hidden alt="Captured sighting photo">
        <canvas id="capture-canvas" hidden></canvas>
        <button id="capture-btn" class="secondary">Capture Photo</button>
        <button id="retake-btn" class="secondary" hidden>Retake</button>
      </div>

      <div class="step-label">Location</div>
      <button id="locate-btn" class="secondary">Get My Location</button>
      <p id="location-status" class="status-info"></p>
      <div id="location-map" hidden></div>

      <div class="step-label">Whale Count</div>
      <div class="count-grid">
        <div class="count-stepper" data-count="whites">
          <span class="count-label">White (adult)</span>
          <div class="count-controls">
            <button class="count-minus" type="button">−</button>
            <span class="count-value">0</span>
            <button class="count-plus" type="button">+</button>
          </div>
        </div>
        <div class="count-stepper" data-count="greys">
          <span class="count-label">Grey (juvenile)</span>
          <div class="count-controls">
            <button class="count-minus" type="button">−</button>
            <span class="count-value">0</span>
            <button class="count-plus" type="button">+</button>
          </div>
        </div>
        <div class="count-stepper" data-count="calves">
          <span class="count-label">Calves</span>
          <div class="count-controls">
            <button class="count-minus" type="button">−</button>
            <span class="count-value">0</span>
            <button class="count-plus" type="button">+</button>
          </div>
        </div>
        <div class="count-stepper" data-count="unknown">
          <span class="count-label">Unknown</span>
          <div class="count-controls">
            <button class="count-minus" type="button">−</button>
            <span class="count-value">0</span>
            <button class="count-plus" type="button">+</button>
          </div>
        </div>
      </div>

      <div id="submit-actions">
        <button id="submit-sighting-btn" class="primary">Submit Sighting</button>
        <p id="submit-status" class="status-info"></p>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"
          integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/offline-queue.js"></script>
  <script src="js/tier-code.js"></script>
  <script src="js/main-menu.js"></script>
  <script src="js/map-view.js"></script>
  <script src="js/list-view.js"></script>
  <script src="js/submit-view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
